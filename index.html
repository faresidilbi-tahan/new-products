<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abed Tahan — Image Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --ink:#1565C0; --line:#dcdcdc; --dim:#777; --bg:#fafafa; --text:#1d2733; --soft:#eef4fc; --warn:#a35c00; --warnbg:#fff3e0; }
  * { box-sizing:border-box; margin:0; }
  body { font-family:'Outfit',-apple-system,"Segoe UI",Roboto,Arial,sans-serif; background:var(--bg); color:var(--ink); display:flex; min-height:100vh; }
  aside { width:262px; background:#1565C0; color:#fff; flex-shrink:0; display:flex; flex-direction:column; position:sticky; top:0; height:100vh; }
  aside .logo { padding:20px 18px 12px; font-size:13px; font-weight:700; }
  .logo img { width:170px !important; }

  /* Navigation */
  #tabs { display:flex; flex-direction:column; gap:3px; margin:4px 12px 10px; padding:4px; background:rgba(255,255,255,.12); border-radius:9px; }
  #tabs button { display:flex; align-items:center; gap:10px; border:none; background:none; color:#dbe7f7; font:600 13.5px 'Outfit',sans-serif; padding:9px 11px; border-radius:6px; cursor:pointer; text-align:left; }
  #tabs button:hover { color:#fff; background:rgba(255,255,255,.08); }
  #tabs button.on { background:#fff; color:#1565C0; }
  #tabs svg { width:16px; height:16px; flex-shrink:0; }
  #tabs button:focus-visible { outline:2px solid #fff; outline-offset:2px; }
  .bk:focus-visible, .pr:focus-visible, .refresh:focus-visible { outline:2px solid #1565C0; outline-offset:-2px; }

  #list { flex:1; overflow-y:auto; padding:6px 10px 14px; }
  #dlist { flex:1; overflow-y:auto; padding:6px 10px 14px; }
  #list button { display:flex; align-items:center; gap:9px; width:100%; text-align:left; background:none; border:none; border-radius:6px; padding:9px 11px; font-size:13px; color:#ccc; cursor:pointer; margin-bottom:2px; }
  #dlist button { display:flex; align-items:center; gap:9px; width:100%; text-align:left; background:none; border:none; border-radius:6px; padding:9px 11px; font-size:13px; color:#ccc; cursor:pointer; margin-bottom:2px; }
  #list button:hover { background:#fff; color:#1565C0; }
  #dlist button:hover { background:#fff; color:#1565C0; }
  #list button.active { background:#fff; color:#1565C0; font-weight:700; }
  #dlist button.active { background:#fff; color:#1565C0; font-weight:700; }
  #list button .num { width:22px; height:22px; border-radius:6px; background:rgba(255,255,255,.15); font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  #dlist button .num { width:22px; height:22px; border-radius:6px; background:rgba(255,255,255,.15); font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  #list button.active .num { background:#1565C0; color:#fff; }
  #dlist button.active .num { background:#1565C0; color:#fff; }
  #list button.done .num { background:#fff; color:#1565C0; }
  #dlist button.done .num { background:#fff; color:#1565C0; }
  #list button.done .num::before { content:"Y"; }
  #dlist button.done .num::before { content:"Y"; }
  #list button.rej .num { background:#555; color:#fff; }
  #dlist button.rej .num { background:#555; color:#fff; }
  #list button.rej .num::before { content:"N"; }
  #dlist button.rej .num::before { content:"N"; }
  #prog { padding:13px 18px; border-top:1px solid #333; font-size:12px; color:#bbb; }
  #dprog { padding:13px 18px; border-top:1px solid #333; font-size:12px; color:#bbb; }
  #prog .track { height:6px; background:#333; border-radius:6px; overflow:hidden; margin-top:6px; }
  #dprog .track { height:6px; background:#333; border-radius:6px; overflow:hidden; margin-top:6px; }
  #prog .fill { height:100%; width:0%; background:#fff; border-radius:6px; transition:width .25s; }
  #dprog .fill { height:100%; width:0%; background:#fff; border-radius:6px; transition:width .25s; }
  #hside { flex:1; padding:8px 18px; font-size:13px; color:#dbe7f7; line-height:1.5; display:none; }

  main { flex:1; padding:24px 28px 100px; min-width:0; }
  .pane { display:none; }
  .pane.active { display:block; }
  .t { font-size:17px; font-weight:700; line-height:1.35; }
  .meta2 { font-size:12px; color:var(--dim); font-family:ui-monospace,Menlo,monospace; margin-top:5px; }
  .imgs { display:grid; grid-template-columns:repeat(auto-fill,minmax(225px,1fr)); gap:15px; margin-top:12px; }
  .cand { border:2px solid var(--line); border-radius:6px; overflow:hidden; cursor:pointer; position:relative; background:#fff; transition:transform .12s, border-color .12s; }
  .cand:hover { transform:translateY(-2px); }
  .cand .imgwrap { height:225px; display:flex; align-items:center; justify-content:center; background:#fff; }
  .cand img { max-width:100%; max-height:100%; object-fit:contain; }
  .cand .meta { font-size:11px; color:var(--dim); padding:6px 10px; border-top:1px solid var(--line); }
  .cand.approved { border-color:#1565C0; }
  .tick { position:absolute; top:10px; left:10px; width:26px; height:26px; border-radius:6px; background:#1565C0; color:#fff; display:none; align-items:center; justify-content:center; font-weight:800; font-size:13px; }
  .cand.approved .tick { display:flex; }
  .mainbtn { position:absolute; top:10px; right:10px; background:#fff; border:1px solid var(--line); font-size:12px; font-weight:600; padding:4px 11px; border-radius:6px; cursor:pointer; color:var(--dim); }
  .cand.ismain .mainbtn { background:#1565C0; color:#fff; border-color:#1565C0; }
  .nav2 { display:flex; gap:10px; margin-top:22px; align-items:center; flex-wrap:wrap; }
  .nav2 button { border:1px solid var(--line); border-radius:6px; padding:11px 20px; font-size:14px; font-weight:600; cursor:pointer; background:#fff; color:#1565C0; }
  .nav2 .back { color:var(--dim); }
  .nav2 .next { background:#1565C0; color:#fff; border-color:#1565C0; }
  .nav2 .fin { background:#1565C0; color:#fff; border-color:#1565C0; }
  .nav2 .none { color:#1565C0; margin-left:auto; }
  .pane.rejected .cand { opacity:.35; pointer-events:none; }
  .pane.rejected .nav2 .none { background:#1565C0; color:#fff; }
  #bar { position:fixed; bottom:0; left:262px; right:0; background:#fff; border-top:1px solid var(--line); padding:12px 20px; display:flex; gap:12px; align-items:center; z-index:10; }
  #dbar { position:fixed; bottom:0; left:262px; right:0; background:#fff; border-top:1px solid var(--line); padding:12px 20px; display:flex; gap:12px; align-items:center; z-index:10; }
  #bar > button { background:#1565C0; color:#fff; border:none; border-radius:6px; padding:12px 20px; font-size:14px; font-weight:700; cursor:pointer; }
  #dbar > button { background:#1565C0; color:#fff; border:none; border-radius:6px; padding:12px 20px; font-size:14px; font-weight:700; cursor:pointer; }
  #bar .n { font-size:12.5px; color:var(--dim); }
  #dbar .n { font-size:12.5px; color:var(--dim); }
  .empty { padding:40px; color:var(--dim); font-size:14px; }

  /* Shared page chrome (History + All products) */
  .page { max-width:1080px; color:var(--text); }
  .h-head { display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .h-head h1 { font-size:24px; font-weight:700; letter-spacing:-.01em; color:var(--text); }
  .h-sub { font-size:13.5px; color:var(--dim); margin-top:3px; }
  .refresh { display:inline-flex; align-items:center; gap:7px; border:1px solid var(--line); background:#fff; color:#1565C0; font:600 13px 'Outfit',sans-serif; padding:9px 14px; border-radius:7px; cursor:pointer; }
  .refresh:hover { border-color:#1565C0; }
  .refresh svg { width:14px; height:14px; }
  .summary { display:grid; grid-template-columns:repeat(5,1fr); background:#fff; border:1px solid var(--line); border-radius:10px; margin:22px 0 18px; }
  .summary.s4 { grid-template-columns:repeat(4,1fr); }
  .summary > div { padding:16px 20px; border-left:1px solid #eee; }
  .summary > div:first-child { border-left:none; }
  .summary .v { font-size:26px; font-weight:700; line-height:1.1; color:var(--text); font-variant-numeric:tabular-nums; }
  .summary .v.blue { color:#1565C0; }
  .summary .v.warn { color:var(--warn); }
  .summary .l { font-size:12.5px; color:var(--dim); margin-top:4px; }
  .search { position:relative; margin-bottom:16px; }
  .search svg { position:absolute; left:12px; top:50%; transform:translateY(-50%); width:15px; height:15px; color:#999; pointer-events:none; }
  .search input { width:100%; border:1px solid var(--line); border-radius:8px; padding:10px 12px 10px 36px; font:400 14px 'Outfit',sans-serif; color:var(--text); background:#fff; }
  .search input:focus { outline:none; border-color:#1565C0; box-shadow:0 0 0 3px rgba(21,101,192,.12); }
  .nores { padding:34px 20px; text-align:center; color:var(--dim); font-size:14px; background:#fff; border:1px solid var(--line); border-radius:10px; }

  /* History: days */
  .days { display:flex; flex-direction:column; gap:16px; }
  .day { background:#fff; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .day-h { display:flex; justify-content:space-between; align-items:center; gap:12px 24px; flex-wrap:wrap; padding:14px 20px 13px; border-bottom:1px solid #eee; }
  .day-d { font-size:16.5px; font-weight:700; }
  .day-t { font-size:13px; color:var(--dim); font-variant-numeric:tabular-nums; margin-top:2px; }
  .day-r { display:flex; align-items:center; gap:12px; font-size:13px; color:var(--dim); font-variant-numeric:tabular-nums; }
  .day-r b { font-weight:700; }
  .mbar { width:120px; height:8px; border-radius:99px; overflow:hidden; display:flex; background:#eef2f7; flex-shrink:0; }
  .mbar span, .rbar span { display:block; height:100%; }
  .mbar .a, .rbar .a { background:#1565C0; }
  .mbar .d, .rbar .d { background:#d9534f; }
  .ok-t { color:#1565C0; }
  .no-t { color:#c0392b; }

  /* Rates summary */
  .rates { background:#fff; border:1px solid var(--line); border-radius:10px; padding:18px 20px 16px; margin:-4px 0 18px; }
  .rates-top { display:flex; align-items:flex-end; gap:36px; flex-wrap:wrap; }
  .rates-top .rv { font-size:30px; font-weight:700; line-height:1; font-variant-numeric:tabular-nums; }
  .rates-top .rl { font-size:13px; color:var(--dim); margin-top:5px; }
  .rates-top .rn { margin-left:auto; font-size:12.5px; color:var(--dim); text-align:right; max-width:320px; line-height:1.45; }
  .rbar { height:12px; border-radius:99px; overflow:hidden; display:flex; background:#eef2f7; margin:14px 0 10px; }
  .rleg { display:flex; gap:22px; flex-wrap:wrap; font-size:13px; color:#555; }
  .rleg i { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:7px; vertical-align:-1px; }
  .bk { display:grid; grid-template-columns:auto minmax(0,1fr) 18px; gap:14px; align-items:center; padding:12px 20px; cursor:pointer; border-top:1px solid #f0f0f0; }
  .day-h + .bk { border-top:none; }
  .bk:hover { background:#f7faff; }
  .bk.open { background:var(--soft); }
  .chip { min-width:36px; height:30px; padding:0 8px; border-radius:7px; font-size:15px; font-weight:700; display:flex; align-items:center; justify-content:center; font-variant-numeric:tabular-nums; }
  .chip.ok { background:var(--soft); color:#1565C0; }
  .bk.open .chip.ok { background:#1565C0; color:#fff; }
  .chip.zero { background:#f1f1f1; color:#777; }
  .chip.nf { background:var(--warnbg); color:var(--warn); }
  .bk-txt { font-size:14.5px; color:var(--text); }
  .bk-txt b { font-weight:600; }
  .chev { width:16px; height:16px; color:#aaa; transition:transform .18s; }
  .open > .chev { transform:rotate(90deg); color:#1565C0; }
  .bk-list { display:none; background:#f8fafd; border-top:1px solid #e8edf4; }
  .bk-list.open { display:block; }
  .pr { display:grid; grid-template-columns:170px minmax(0,1fr) 54px 18px; gap:14px; align-items:center; padding:10px 20px 10px 70px; cursor:pointer; border-top:1px solid #edf1f6; }
  .pr:first-child { border-top:none; }
  .pr:hover { background:#eef4fc; }
  .pr.open { background:#e6effb; }
  .pr-sku { font-size:13.5px; font-weight:600; color:var(--text); font-variant-numeric:tabular-nums; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pr-title { font-size:13.5px; color:#59626d; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pr-time { font-size:12.5px; color:var(--dim); text-align:right; font-variant-numeric:tabular-nums; }
  .pr-img { display:none; padding:6px 20px 20px 70px; background:#e6effb; }
  .pr-img.open { display:block; }
  .dlabel { font-size:13px; font-weight:600; color:var(--text); margin:6px 0 12px; }
  .dlabel span { font-weight:400; color:var(--dim); }
  .thumbs { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; }
  .thumb { display:block; background:#fff; border:1px solid var(--line); border-radius:8px; overflow:hidden; position:relative; }
  .thumb:hover { border-color:#1565C0; }
  .thumb .iw { height:150px; display:flex; align-items:center; justify-content:center; padding:10px; }
  .thumb img { max-width:100%; max-height:100%; object-fit:contain; }
  .thumb .tag { position:absolute; top:8px; left:8px; background:#1565C0; color:#fff; font-size:11.5px; font-weight:600; padding:3px 8px; border-radius:5px; }
  .thumb .pos { position:absolute; top:8px; right:8px; background:#fff; border:1px solid var(--line); color:#666; font-size:11.5px; font-weight:600; padding:2px 7px; border-radius:5px; }
  .thumb.dim img { opacity:.45; filter:grayscale(1); }
  .nfnote { display:flex; gap:12px; align-items:flex-start; background:#fff; border:1px solid #f3d9b1; border-radius:8px; padding:14px 16px; font-size:13.5px; color:#5c4a33; max-width:560px; }
  .nfnote svg { width:18px; height:18px; color:var(--warn); flex-shrink:0; margin-top:1px; }
  .nfnote b { display:block; color:var(--text); font-weight:600; margin-bottom:2px; }

  /* All products: distribution */
  .dist { background:#fff; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .drow { display:grid; grid-template-columns:120px minmax(0,1fr) 100px 64px 18px; gap:18px; align-items:center; padding:13px 20px; border-top:1px solid #eee; }
  .drow.head { border-top:none; background:#f7f8fa; font-size:12.5px; font-weight:600; color:var(--dim); padding-top:11px; padding-bottom:11px; }
  .drow .lab { font-size:14.5px; font-weight:600; }
  .drow .lab.warn { color:var(--warn); }
  .bar { height:10px; background:#eef2f7; border-radius:99px; overflow:hidden; }
  .bar span { display:block; height:100%; background:#1565C0; border-radius:99px; min-width:3px; }
  .bar.warn span { background:#e08a1e; }
  .drow .cnt { text-align:right; font-size:15px; font-weight:700; font-variant-numeric:tabular-nums; }
  .drow .pct { text-align:right; font-size:13px; color:var(--dim); font-variant-numeric:tabular-nums; }
  .drow.head .cnt, .drow.head .pct { font-size:12.5px; font-weight:600; }
  .counted { font-size:12.5px; color:var(--dim); margin-top:12px; }
  .drow.click { cursor:pointer; }
  .drow.click:hover { background:#f7faff; }
  .drow.open { background:var(--soft); }
  .drow:focus-visible { outline:2px solid #1565C0; outline-offset:-2px; }
  .dlist { display:none; background:#f8fafd; border-top:1px solid #e8edf4; }
  .dlist.open { display:block; }
  .dl-bar { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; padding:12px 20px; }
  .dl-bar input { flex:1; min-width:180px; max-width:340px; border:1px solid var(--line); border-radius:7px; padding:8px 11px; font:400 13.5px 'Outfit',sans-serif; color:var(--text); background:#fff; }
  .dl-bar input:focus { outline:none; border-color:#1565C0; }
  .dl-count { font-size:13px; color:var(--dim); font-variant-numeric:tabular-nums; }
  .btn-sm { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); background:#fff; color:#1565C0; font:600 12.5px 'Outfit',sans-serif; padding:7px 12px; border-radius:7px; cursor:pointer; white-space:nowrap; }
  .btn-sm:hover { border-color:#1565C0; }
  .btn-sm.solid { background:#1565C0; color:#fff; border-color:#1565C0; }
  .btn-sm svg { width:13px; height:13px; }
  .hbtns { display:flex; gap:8px; flex-wrap:wrap; }
  .sr { display:grid; grid-template-columns:190px minmax(0,1fr) 150px 26px; gap:14px; align-items:center; padding:9px 20px; border-top:1px solid #edf1f6; font-size:13.5px; }
  .sr .sku { font-weight:600; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .sr .sku.none { color:#aaa; font-weight:500; }
  .sr .ti { color:#59626d; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sr .ve { color:var(--dim); font-size:12.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sr a { color:#aaa; display:flex; }
  .sr a:hover { color:#1565C0; }
  .sr a svg { width:15px; height:15px; }
  .more { display:flex; justify-content:center; padding:12px 0 16px; border-top:1px solid #edf1f6; }

  /* Mode switch: Images / Descriptions */
  #modes { display:flex; gap:4px; margin:0 12px 8px; padding:4px; background:rgba(0,0,0,.16); border-radius:9px; }
  #modes button { flex:1; border:none; background:none; color:#dbe7f7; font:700 12.5px 'Outfit',sans-serif; padding:8px 6px; border-radius:6px; cursor:pointer; }
  #modes button:hover { color:#fff; }
  #modes button.on { background:#FFD400; color:#0d3c78; }
  #modes button:focus-visible { outline:2px solid #fff; outline-offset:2px; }

  /* Description review */
  .dpane { display:none; }
  .dpane.active { display:block; }
  .dsrc { font-size:12.5px; color:var(--dim); margin-top:6px; }
  .dsrc a { color:#1565C0; }
  .dcols { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.25fr); gap:16px; margin-top:14px; }
  .dcol { background:#fff; border:1px solid var(--line); border-radius:8px; display:flex; flex-direction:column; min-width:0; }
  .dcol.new { border:2px solid var(--line); }
  .dpane.approved .dcol.new { border-color:#1565C0; }
  .dpane.declined .dcol.new { opacity:.5; }
  .dcol-h { display:flex; align-items:center; gap:10px; padding:10px 14px; border-bottom:1px solid #eee; font-size:13px; font-weight:600; color:var(--text); }
  .dcol-h span { font-weight:400; color:var(--dim); font-size:12px; }
  .htmlbtn { margin-left:auto; border:1px solid var(--line); background:#fff; color:#1565C0; font:600 12px 'Outfit',sans-serif; padding:4px 10px; border-radius:6px; cursor:pointer; }
  .dbody, .ddesc { padding:14px 16px; font-size:14px; line-height:1.6; color:var(--text); overflow:auto; }
  .dbody { max-height:560px; }
  .dbody.cur { color:#59626d; }
  .dbody.edit { outline:none; min-height:260px; }
  .dbody.edit:focus { box-shadow:inset 0 0 0 2px rgba(21,101,192,.15); }
  .dbody h2, .dbody h3, .dbody h4, .ddesc h2, .ddesc h3, .ddesc h4 { font-size:15px; margin:14px 0 6px; }
  .dbody p, .ddesc p { margin:0 0 10px; }
  .dbody ul, .dbody ol, .ddesc ul, .ddesc ol { margin:0 0 10px; padding-left:20px; }
  .dbody li, .ddesc li { margin:3px 0; }
  .dbody table, .ddesc table { border-collapse:collapse; margin-bottom:10px; }
  .dbody td, .dbody th, .ddesc td, .ddesc th { border:1px solid #eee; padding:4px 8px; text-align:left; }
  .dbody .none { color:#aaa; font-style:italic; }
  .dhtml { width:100%; min-height:420px; border:none; padding:14px 16px; font:12.5px/1.5 ui-monospace,Menlo,monospace; color:var(--text); resize:vertical; outline:none; border-radius:0 0 8px 8px; }
  .nav2 .dno { margin-left:auto; color:#c0392b; }
  .nav2 .dyes { color:#1565C0; border-color:#1565C0; }
  .dpane.approved .nav2 .dyes { background:#1565C0; color:#fff; }
  .dpane.declined .nav2 .dno { background:#c0392b; color:#fff; border-color:#c0392b; }
  .chip.no { background:#fdecea; color:#c0392b; }
  .bk.open .chip.no { background:#c0392b; color:#fff; }
  .ddesc { background:#fff; border:1px solid var(--line); border-radius:8px; max-height:440px; max-width:820px; }
  .ddesc.dim { color:#8a8f96; }

  @media (max-width:1000px){ .dcols { grid-template-columns:1fr; } }
  @media (prefers-reduced-motion:reduce){ * { transition:none !important; } }
  @media (max-width:860px){
    .summary, .summary.s4 { grid-template-columns:repeat(2,1fr); }
    .summary > div:nth-child(odd) { border-left:none; }
    .summary > div:nth-child(n+3) { border-top:1px solid #eee; }
    .summary:not(.s4) > div:last-child { grid-column:1 / -1; }
    .pr { grid-template-columns:minmax(0,1fr) 18px; padding-left:20px; }
    .pr .pr-title, .pr .pr-time { display:none; }
    .pr-img { padding-left:20px; }
    .drow { grid-template-columns:90px minmax(0,1fr) 70px 18px; }
    .sr { grid-template-columns:130px minmax(0,1fr) 26px; }
    .sr .ve { display:none; }
    .drow .pct { display:none; }
  }
  @media (max-width:700px){ aside{width:66px} aside .logo, #list button .lbl, #dlist button .lbl, #prog, #dprog, #tabs .lbl, #hside{display:none} #modes{flex-direction:column; margin:12px 8px 0} #modes button{font-size:10.5px; padding:6px 2px} #tabs{margin:12px 8px} #tabs button{justify-content:center} #bar, #dbar{left:66px} main{padding:20px 16px 100px} }
</style>
</head>
<body>
<aside>
  <div class="logo"><img style="width:100%; margin: auto;" src="https://abedtahan.com/cdn/shop/files/AT_Logo_400x200_Transparent.png?v=1732612010&amp;width=250"><span id="batchlabel" style="display:block;margin-top:8px">Loading...</span></div>
  <div id="modes">
    <button id="mode-img" class="on" onclick="setMode('img')">Images</button>
    <button id="mode-desc" onclick="setMode('desc')">Descriptions</button>
  </div>
  <nav id="tabs">
    <button id="tab-review" data-mode="img" class="on" onclick="setView('review')" title="Review">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      <span class="lbl">Review</span>
    </button>
    <button id="tab-history" data-mode="img" onclick="setView('history')" title="History">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg>
      <span class="lbl">History</span>
    </button>
    <button id="tab-products" data-mode="img" onclick="setView('products')" title="All products">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/></svg>
      <span class="lbl">All products</span>
    </button>
    <button id="tab-dreview" data-mode="desc" style="display:none" onclick="setView('dreview')" title="Review">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h10"/></svg>
      <span class="lbl">Review</span>
    </button>
    <button id="tab-dhistory" data-mode="desc" style="display:none" onclick="setView('dhistory')" title="History">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg>
      <span class="lbl">History</span>
    </button>
  </nav>
  <div id="list"></div>
  <div id="dlist" style="display:none"></div>
  <div id="hside"></div>
  <div id="prog"><span id="ptxt">0 / 0 reviewed</span><div class="track"><div class="fill" id="pfill"></div></div></div>
  <div id="dprog" style="display:none"><span id="dptxt">0 / 0 reviewed</span><div class="track"><div class="fill" id="dpfill"></div></div></div>
</aside>
<main>
  <div id="review"><div class="empty">Loading pending items…</div></div>
  <div id="history" class="page" style="display:none"></div>
  <div id="products" class="page" style="display:none"></div>
  <div id="dreview" style="display:none"><div class="empty">Loading descriptions…</div></div>
  <div id="dhistory" class="page" style="display:none"></div>
</main>
<div id="bar" style="display:none">
  <button onclick="submitAll()">Confirm & Upload to Shopify</button>
  <span class="n" id="exnote">Click images to approve · "Main" = cover photo · "None good" if all bad</span>
</div>
<div id="dbar" style="display:none">
  <button onclick="dsubmit()">Confirm & Update Shopify</button>
  <span class="n" id="dnote">Edit the text if needed, then Approve or Decline each product</span>
</div>
<script>
// ---- Point these at your n8n instance ----
const PENDING_URL  = "https://n8n.srv838782.hstgr.cloud/webhook/image-review-pending";
const SUBMIT_URL   = "https://n8n.srv838782.hstgr.cloud/webhook/image-review-submit";
const HISTORY_URL  = "https://n8n.srv838782.hstgr.cloud/webhook/image-review-history";
const PRODUCTS_URL = "https://n8n.srv838782.hstgr.cloud/webhook/image-review-products";
const DPENDING_URL = "https://n8n.srv838782.hstgr.cloud/webhook/desc-review-pending";
const DSUBMIT_URL  = "https://n8n.srv838782.hstgr.cloud/webhook/desc-review-submit";
const DHISTORY_URL = "https://n8n.srv838782.hstgr.cloud/webhook/desc-review-history";
// -------------------------------------------

let DATA = [];
const sel = {};
const rejected = new Set();
const main = document.getElementById('review');
const list = document.getElementById('list');
let view = 'review';

// ================= Review =================
async function load() {
  try {
    const res = await fetch(PENDING_URL);
    const json = await res.json();
    DATA = (json.products || []).map((p, i) => ({ ...p, n: i + 1 }));
    rejected.clear();
    DATA.forEach(p => { sel[p.k] = { approved: new Set(), main: null }; });
    render();
  } catch (e) {
    main.innerHTML = `<div class="empty">Couldn't load pending items. Check PENDING_URL and that the n8n workflow is active.<br><br>${e}</div>`;
  }
}

function render() {
  updateBatchLabel();
  list.innerHTML = '';
  if (!DATA.length) {
    main.innerHTML = '<div class="empty">Nothing pending right now — all caught up.</div>';
    document.getElementById('bar').style.display = 'none';
    refreshProgress();
    return;
  }
  document.getElementById('bar').style.display = view === 'review' ? 'flex' : 'none';
  main.innerHTML = '';

  DATA.forEach((p, i) => {
    const b = document.createElement('button');
    b.innerHTML = `<span class="num"><i>${p.n}</i></span><span class="lbl">${p.title || p.k}</span>`;
    b.dataset.pane = p.k;
    b.onclick = () => activate(p.k);
    list.appendChild(b);

    const d = document.createElement('div');
    d.className = 'pane';
    d.id = 'p-' + p.k;
    d.innerHTML = `
      <div class="t">${p.title || ''}</div>
      <div class="meta2">SKU: ${p.sku || 'n/a'} · Vendor: ${p.vendor || 'n/a'}</div>
      <div class="imgs">${p.cands.map(c => `
        <div class="cand" data-k="${p.k}" data-l="${c.l}">
          <span class="tick">Y</span>
          <button class="mainbtn" onclick="setMain(event,'${p.k}','${c.l}')">Main</button>
          <div class="imgwrap"><img loading="lazy" src="${c.url}" onerror="this.closest('.cand').style.display='none'"></div>
          <div class="meta">${c.src || ''}</div>
        </div>`).join('')}</div>
      <div class="nav2">
        ${i > 0 ? `<button class="back" onclick="activate('${DATA[i - 1].k}')">Back</button>` : ''}
        ${i < DATA.length - 1 ? `<button class="next" onclick="activate('${DATA[i + 1].k}')">Next</button>` : `<button class="fin" onclick="submitAll()">Finish</button>`}
        <button class="none" onclick="toggleReject('${p.k}')">None are good</button>
      </div>`;
    main.appendChild(d);
  });

  document.querySelectorAll('.cand').forEach(el => {
    el.addEventListener('click', e => {
      if (e.target.classList.contains('mainbtn')) return;
      const k = el.dataset.k;
      if (rejected.has(k)) return;
      const s = sel[k], l = el.dataset.l;
      if (s.approved.has(l)) {
        s.approved.delete(l); el.classList.remove('approved');
        if (s.main === l) { s.main = null; el.classList.remove('ismain'); }
      } else {
        s.approved.add(l); el.classList.add('approved');
        if (!s.main) { s.main = l; el.classList.add('ismain'); }
      }
      refreshProgress();
    });
  });

  activate(DATA[0].k);
  refreshProgress();
}

function activate(id) {
  document.querySelectorAll('#list button').forEach(b => b.classList.toggle('active', b.dataset.pane === id));
  document.querySelectorAll('.pane').forEach(p => p.classList.toggle('active', p.id === 'p-' + id));
  window.scrollTo(0, 0);
}

function refreshProgress() {
  let done = 0;
  DATA.forEach(p => {
    const btn = document.querySelector(`#list button[data-pane="${p.k}"]`);
    const has = sel[p.k].approved.size > 0, rej = rejected.has(p.k);
    btn.classList.toggle('done', has && !rej);
    btn.classList.toggle('rej', rej);
    if (has || rej) done++;
  });
  document.getElementById('ptxt').textContent = done + ' / ' + DATA.length + ' reviewed';
  document.getElementById('pfill').style.width = (DATA.length ? done / DATA.length * 100 : 0) + '%';
}

function toggleReject(k) {
  const pane = document.getElementById('p-' + k);
  if (rejected.has(k)) { rejected.delete(k); pane.classList.remove('rejected'); }
  else {
    rejected.add(k); pane.classList.add('rejected');
    sel[k].approved.clear(); sel[k].main = null;
    pane.querySelectorAll('.cand').forEach(c => c.classList.remove('approved', 'ismain'));
  }
  refreshProgress();
}

function setMain(e, k, l) {
  e.stopPropagation();
  if (rejected.has(k)) return;
  document.querySelectorAll(`.cand[data-k="${CSS.escape(k)}"]`).forEach(c => c.classList.remove('ismain'));
  const s = sel[k]; s.main = l; s.approved.add(l);
  document.querySelector(`.cand[data-k="${CSS.escape(k)}"][data-l="${l}"]`).classList.add('ismain', 'approved');
  refreshProgress();
}

async function submitAll() {
  const approved = {}, skipped = [], statuses = [];
  const RANK = { main: 3, approved: 2, unchosen: 1, rejected: 1 };
  DATA.forEach(p => {
    const byUrl = {};
    const put = (url, status) => { if (!byUrl[url] || RANK[status] > RANK[byUrl[url]]) byUrl[url] = status; };
    if (rejected.has(p.k)) {
      p.cands.forEach(c => put(c.url, 'rejected'));
    } else {
      const s = sel[p.k];
      if (!s.approved.size) { skipped.push(p.k); return; }
      const mainL = s.main || [...s.approved][0];
      approved[p.k] = [...new Set([mainL, ...[...s.approved].filter(l => l !== mainL)].map(l => p.cands.find(c => c.l === l).url))];
      p.cands.forEach(c => put(c.url, c.l === mainL ? 'main' : (s.approved.has(c.l) ? 'approved' : 'unchosen')));
    }
    Object.entries(byUrl).forEach(([url, status]) => statuses.push({ productId: p.k, url, status }));
  });

  if (!statuses.length) {
    document.getElementById('exnote').textContent = 'Nothing reviewed yet — approve images or mark "None are good" first.';
    return;
  }

  const payload = { approved, rejected: [...rejected], skipped, statuses };

  document.getElementById('exnote').textContent = 'Uploading to Shopify…';
  try {
    const res = await fetch(SUBMIT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    document.getElementById('exnote').textContent = 'Sent to Shopify. Reloading...';
    HIST_LOADED = false;
    setTimeout(load, 1200);
  } catch (e) {
    document.getElementById('exnote').textContent = 'Failed to submit: ' + e;
  }
}

// ================= Shared helpers =================
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const num = n => Number(n || 0).toLocaleString('en-US');
const plural = (n, one, many) => `${num(n)} ${n === 1 ? one : many}`;
const CHEV = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>';
const REFRESH_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>';
const NF_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/><path d="M8.5 11h5"/></svg>';

function fmtTime(d) {
  const x = new Date(d);
  return isNaN(x) ? '' : x.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });
}
function dayKey(d) {
  const x = new Date(d);
  if (!d || isNaN(x)) return 'unknown';
  return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}-${String(x.getDate()).padStart(2, '0')}`;
}
function dayLabel(key) {
  if (key === 'unknown') return 'Unknown date';
  const [y, m, d] = key.split('-').map(Number);
  const x = new Date(y, m - 1, d);
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const diff = Math.round((today - x) / 86400000);
  const base = x.toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short', year:'numeric' });
  if (diff === 0) return 'Today, ' + base;
  if (diff === 1) return 'Yesterday, ' + base;
  return base;
}
function ago(d) {
  const m = Math.round((Date.now() - new Date(d)) / 60000);
  if (isNaN(m)) return '';
  if (m < 1) return 'just now';
  if (m < 60) return m + ' min ago';
  const h = Math.round(m / 60);
  if (h < 24) return h + (h === 1 ? ' hour ago' : ' hours ago');
  return new Date(d).toLocaleDateString('en-GB', { day:'numeric', month:'short' }) + ' at ' + fmtTime(d);
}
function toggleOpen(el) {
  const open = !el.classList.contains('open');
  el.classList.toggle('open', open);
  el.setAttribute('aria-expanded', open);
  el.nextElementSibling.classList.toggle('open', open);
}
function keyToggle(e, el) {
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleOpen(el); }
}

// ================= Views =================
const VIEWS = ['review', 'history', 'products', 'dreview', 'dhistory'];
const SIDE_TEXT = {
  history: 'Reviewed products grouped by day. Click a line to see its SKUs, then a SKU to see its images.',
  products: 'Active products on abedtahan.com, counted by how many images each one has. Click a line to see its SKUs.',
  dhistory: 'Reviewed descriptions grouped by day. Click a line to see its SKUs, then a SKU to see the description.'
};
let mode = 'img';

function setMode(m) {
  mode = m;
  document.getElementById('mode-img').classList.toggle('on', m === 'img');
  document.getElementById('mode-desc').classList.toggle('on', m === 'desc');
  document.querySelectorAll('#tabs [data-mode]').forEach(b => { b.style.display = b.dataset.mode === m ? '' : 'none'; });
  setView(m === 'img' ? 'review' : 'dreview');
}

function updateBatchLabel() {
  document.getElementById('batchlabel').textContent = (mode === 'desc' ? DDATA.length : DATA.length) + ' pending';
}

function setView(v) {
  view = v;
  VIEWS.forEach(x => {
    document.getElementById('tab-' + x).classList.toggle('on', x === v);
    document.getElementById(x).style.display = x === v ? '' : 'none';
  });
  list.style.display = v === 'review' ? '' : 'none';
  document.getElementById('prog').style.display = v === 'review' ? '' : 'none';
  document.getElementById('dlist').style.display = v === 'dreview' ? '' : 'none';
  document.getElementById('dprog').style.display = v === 'dreview' ? '' : 'none';
  const side = document.getElementById('hside');
  side.style.display = SIDE_TEXT[v] ? 'block' : 'none';
  side.textContent = SIDE_TEXT[v] || '';
  document.getElementById('bar').style.display = (v === 'review' && DATA.length) ? 'flex' : 'none';
  document.getElementById('dbar').style.display = (v === 'dreview' && DDATA.length) ? 'flex' : 'none';
  updateBatchLabel();
  window.scrollTo(0, 0);
  if (v === 'history') loadHistory();
  if (v === 'products') loadProducts(false);
  if (v === 'dreview' && !DLOADED) dload();
  if (v === 'dhistory') dloadHistory();
}

// ================= History =================
let HIST = [];
let HIST_LOADED = false;
let hQuery = '';
const hist = document.getElementById('history');

async function loadHistory(force) {
  if (HIST_LOADED && !force) { renderHistory(); return; }
  hist.innerHTML = '<div class="empty">Loading history…</div>';
  try {
    const res = await fetch(HISTORY_URL);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();
    HIST = json.history || [];
    HIST_LOADED = true;
    renderHistory();
  } catch (e) {
    hist.innerHTML = `<div class="empty">Couldn't load history. Check HISTORY_URL and that the n8n workflow is active.<br><br>${esc(e)}</div>`;
  }
}

function renderHistory() {
  const total = HIST.length;
  const withImgs = HIST.filter(p => p.chosen.length).length;
  const imgs = HIST.reduce((a, p) => a + p.chosen.length, 0);
  const nf = HIST.filter(p => p.notFound).length;
  const none = total - withImgs - nf;
  const R = rates(HIST);

  hist.innerHTML = `
    <div class="h-head">
      <div>
        <h1>Upload history</h1>
        <div class="h-sub">What was uploaded to Shopify, day by day</div>
      </div>
      <button class="refresh" onclick="loadHistory(true)">${REFRESH_ICON}Refresh</button>
    </div>
    <div class="summary">
      <div><div class="v">${num(total)}</div><div class="l">Products reviewed</div></div>
      <div><div class="v blue">${num(imgs)}</div><div class="l">Images uploaded</div></div>
      <div><div class="v">${num(withImgs)}</div><div class="l">Products with images</div></div>
      <div><div class="v">${num(none)}</div><div class="l">No image uploaded</div></div>
      <div><div class="v warn">${num(nf)}</div><div class="l">Not found online</div></div>
    </div>
    ${R.base ? `<div class="rates">
      <div class="rates-top">
        <div><div class="rv ok-t">${R.ap}%</div><div class="rl">Approve rate</div></div>
        <div><div class="rv no-t">${R.dp}%</div><div class="rl">Decline rate</div></div>
        <div class="rn">Out of ${plural(R.base, 'reviewed product', 'reviewed products')}. Not-found products aren't counted.</div>
      </div>
      <div class="rbar"><span class="a" style="width:${R.ap}%"></span><span class="d" style="width:${R.dp}%"></span></div>
      <div class="rleg">
        <span><i style="background:#1565C0"></i>${plural(R.a, 'product', 'products')} approved (1 or more images chosen)</span>
        <span><i style="background:#d9534f"></i>${plural(R.d, 'product', 'products')} declined (no image chosen)</span>
      </div>
    </div>` : ''}
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="hsearch" type="search" placeholder="Search by SKU, product or vendor" value="${esc(hQuery)}">
    </div>
    <div id="hdays"></div>`;

  document.getElementById('hsearch').addEventListener('input', e => { hQuery = e.target.value; renderDays(); });
  renderDays();
}

function rates(list) {
  const a = list.filter(p => p.chosen.length).length;
  const d = list.filter(p => !p.notFound && !p.chosen.length).length;
  const base = a + d;
  const ap = base ? Math.round(a / base * 100) : 0;
  return { a, d, base, ap, dp: base ? 100 - ap : 0 };
}

function bucketOf(p) {
  if (p.notFound) return 'nf';
  return String(p.chosen.length);
}
function bucketText(b, count) {
  const prods = `<b>${plural(count, 'product', 'products')}</b>`;
  if (b === 'nf') return `${prods} not found online`;
  const n = Number(b);
  if (n === 0) return `${prods} had no image uploaded`;
  return `${prods} had ${plural(n, 'image', 'images')} uploaded`;
}
function bucketOrder(b) {
  if (b === 'nf') return -2;
  return Number(b) === 0 ? -1 : Number(b);
}

function renderDays() {
  const box = document.getElementById('hdays');
  if (!HIST.length) { box.innerHTML = '<div class="nores">No reviewed products yet. They appear here after you confirm a review.</div>'; return; }

  const q = hQuery.trim().toLowerCase();
  const rows = q
    ? HIST.filter(p => [p.sku, p.title, p.vendor, p.k].some(v => String(v || '').toLowerCase().includes(q)))
    : HIST;
  if (!rows.length) { box.innerHTML = '<div class="nores">No products match this search.</div>'; return; }

  // day -> bucket -> products
  const days = {};
  rows.forEach(p => {
    const dk = dayKey(p.at);
    (days[dk] = days[dk] || {})[bucketOf(p)] = (days[dk][bucketOf(p)] || []).concat(p);
  });

  const dayKeys = Object.keys(days).sort((a, b) => a === 'unknown' ? 1 : b === 'unknown' ? -1 : b.localeCompare(a));

  box.innerHTML = '<div class="days">' + dayKeys.map(dk => {
    const buckets = days[dk];
    const all = Object.values(buckets).flat();
    const dayImgs = all.reduce((a, p) => a + p.chosen.length, 0);
    const bKeys = Object.keys(buckets).sort((a, b) => bucketOrder(b) - bucketOrder(a));
    const r = rates(all);

    return `<section class="day">
      <div class="day-h">
        <div>
          <div class="day-d">${dayLabel(dk)}</div>
          <div class="day-t">${plural(all.length, 'product', 'products')} reviewed, ${plural(dayImgs, 'image', 'images')} uploaded</div>
        </div>
        ${r.base ? `<div class="day-r">
          <div class="mbar"><span class="a" style="width:${r.ap}%"></span><span class="d" style="width:${r.dp}%"></span></div>
          <span><b class="ok-t">${r.ap}%</b> approved</span>
          <span><b class="no-t">${r.dp}%</b> declined</span>
        </div>` : '<div class="day-r">Only not-found products</div>'}
      </div>
      ${bKeys.map(b => {
        const prods = buckets[b].slice().sort((x, y) => new Date(y.at || 0) - new Date(x.at || 0));
        const chipCls = b === 'nf' ? 'nf' : (Number(b) ? 'ok' : 'zero');
        return `
        <div class="bk" tabindex="0" role="button" aria-expanded="${q ? 'true' : 'false'}" ${q ? 'data-open' : ''} onclick="toggleOpen(this)" onkeydown="keyToggle(event,this)">
          <span class="chip ${chipCls}">${b === 'nf' ? '?' : b}</span>
          <span class="bk-txt">${bucketText(b, prods.length)}</span>
          ${CHEV}
        </div>
        <div class="bk-list">${prods.map(p => `
          <div class="pr" tabindex="0" role="button" aria-expanded="false" onclick="toggleOpen(this)" onkeydown="keyToggle(event,this)">
            <span class="pr-sku">${esc(p.sku || 'No SKU')}</span>
            <span class="pr-title">${esc(p.title || p.k)}</span>
            <span class="pr-time">${fmtTime(p.at)}</span>
            ${CHEV}
          </div>
          <div class="pr-img">${detail(p)}</div>`).join('')}
        </div>`;
      }).join('')}
    </section>`;
  }).join('') + '</div>';

  // When searching, open matching buckets so results are visible
  if (q) box.querySelectorAll('.bk[data-open]').forEach(el => { el.classList.add('open'); el.nextElementSibling.classList.add('open'); });
}

function detail(p) {
  if (p.notFound) {
    return `<div class="nfnote">${NF_ICON}
      <div><b>No images found online</b>Search found nothing for this product. Ask the supplier for photos and add them in Shopify.</div>
    </div>`;
  }
  if (p.chosen.length) {
    return `<div class="dlabel">${esc(p.title || '')} <span>(${plural(p.chosen.length, 'image', 'images')}, in upload order)</span></div>
      <div class="thumbs">${p.chosen.map((u, i) => `
        <a class="thumb" href="${esc(u)}" target="_blank" rel="noopener">
          ${i === 0 ? '<span class="tag">Main</span>' : ''}<span class="pos">${i + 1}</span>
          <div class="iw"><img loading="lazy" src="${esc(u)}" alt=""></div>
        </a>`).join('')}</div>`;
  }
  if (!p.others.length) return '<div class="dlabel">No image uploaded <span>(no candidates on record)</span></div>';
  return `<div class="dlabel">No image uploaded <span>(candidates you rejected)</span></div>
    <div class="thumbs">${p.others.map(u => `
      <a class="thumb dim" href="${esc(u)}" target="_blank" rel="noopener">
        <div class="iw"><img loading="lazy" src="${esc(u)}" alt=""></div>
      </a>`).join('')}</div>`;
}

// ================= All products =================
let PROD = null;
let PROD_BY = {};
const prodEl = document.getElementById('products');
const PAGE = 200;
const SHOP_ADMIN = 'https://admin.shopify.com/store/jad-b-2/products/';
const DL_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>';
const EXT_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6"/><path d="M10 14 20 4"/><path d="M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/></svg>';

async function loadProducts(force) {
  if (PROD && !force) { renderProducts(); return; }
  prodEl.innerHTML = `<div class="empty">Counting images on every active product… The first count can take up to a minute.</div>`;
  try {
    const res = await fetch(PRODUCTS_URL + (force ? '?refresh=1' : ''));
    if (!res.ok) throw new Error('HTTP ' + res.status);
    PROD = await res.json();
    // rows: [id, skus, title, vendor, imageCount]
    PROD_BY = {};
    (PROD.products || []).forEach(r => { (PROD_BY[r[4]] = PROD_BY[r[4]] || []).push(r); });
    Object.values(PROD_BY).forEach(a => a.sort((x, y) => String(x[1] || '~').localeCompare(String(y[1] || '~'))));
    renderProducts();
  } catch (e) {
    prodEl.innerHTML = `<div class="empty">Couldn't count products. Check PRODUCTS_URL and that the n8n workflow is active.<br><br>${esc(e)}</div>`;
  }
}

const imgLabel = n => n === 0 ? 'No images' : plural(n, 'image', 'images');

function renderProducts() {
  const buckets = (PROD.buckets || []).slice().sort((a, b) => a.images - b.images);
  const total = PROD.total || 0;
  const totalImgs = PROD.totalImages || 0;
  const zero = (buckets.find(b => b.images === 0) || {}).products || 0;
  const max = Math.max(1, ...buckets.map(b => b.products));
  const avg = total ? (totalImgs / total).toFixed(1) : '0';
  const hasList = Array.isArray(PROD.products);

  prodEl.innerHTML = `
    <div class="h-head">
      <div>
        <h1>All products</h1>
        <div class="h-sub">Active products on the website by number of images</div>
      </div>
      <div class="hbtns">
        ${hasList ? `<button class="refresh" onclick="exportAll()">${DL_ICON}Export all</button>` : ''}
        <button class="refresh" onclick="loadProducts(true)">${REFRESH_ICON}Recount</button>
      </div>
    </div>
    <div class="summary s4">
      <div><div class="v">${num(total)}</div><div class="l">Products on website</div></div>
      <div><div class="v blue">${num(totalImgs)}</div><div class="l">Images in total</div></div>
      <div><div class="v">${avg}</div><div class="l">Images per product</div></div>
      <div><div class="v warn">${num(zero)}</div><div class="l">Products with no images</div></div>
    </div>
    ${buckets.length ? `<div class="dist">
      <div class="drow head"><div>Images</div><div>Share of products</div><div class="cnt">Products</div><div class="pct">%</div><div></div></div>
      ${buckets.map(b => {
        const warn = b.images === 0;
        const pct = total ? (b.products / total * 100) : 0;
        return `<div class="drow ${hasList ? 'click' : ''}" ${hasList ? `tabindex="0" role="button" aria-expanded="false" onclick="openBucket(this,${b.images})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openBucket(this,${b.images})}"` : ''}>
          <div class="lab ${warn ? 'warn' : ''}">${imgLabel(b.images)}</div>
          <div class="bar ${warn ? 'warn' : ''}"><span style="width:${(b.products / max * 100).toFixed(1)}%"></span></div>
          <div class="cnt">${num(b.products)}</div>
          <div class="pct">${pct < 0.1 && pct > 0 ? '<0.1' : pct.toFixed(1)}%</div>
          ${hasList ? CHEV : '<div></div>'}
        </div>
        <div class="dlist" data-n="${b.images}"></div>`;
      }).join('')}
    </div>` : '<div class="nores">No active products found.</div>'}
    <div class="counted">${PROD.updatedAt ? 'Counted ' + ago(PROD.updatedAt) + '. Counts refresh automatically every 6 hours, or click Recount.' : ''}
      ${hasList ? '' : ' Click Recount to load the SKU lists.'}</div>`;
}

function openBucket(el, n) {
  toggleOpen(el);
  const box = el.nextElementSibling;
  if (el.classList.contains('open') && !box.dataset.ready) {
    box.dataset.ready = '1';
    box.innerHTML = `
      <div class="dl-bar">
        <input type="search" placeholder="Filter by SKU, product or vendor" oninput="filterBucket(this, ${n})">
        <div style="display:flex;gap:10px;align-items:center">
          <span class="dl-count"></span>
          <button class="btn-sm solid" onclick="exportBucket(${n}, this)">${DL_ICON}Export</button>
        </div>
      </div>
      <div class="dl-rows"></div>`;
    box._q = '';
    box._limit = PAGE;
    drawBucket(box, n);
  }
}

function bucketRows(box, n) {
  const q = (box._q || '').trim().toLowerCase();
  const all = PROD_BY[n] || [];
  return q ? all.filter(r => [r[1], r[2], r[3]].some(v => String(v || '').toLowerCase().includes(q))) : all;
}

function drawBucket(box, n) {
  const rows = bucketRows(box, n);
  const shown = rows.slice(0, box._limit);
  box.querySelector('.dl-count').textContent = `${num(rows.length)} ${rows.length === 1 ? 'product' : 'products'}`;
  box.querySelector('.dl-rows').innerHTML = (rows.length ? shown.map(r => `
    <div class="sr">
      <span class="sku ${r[1] ? '' : 'none'}">${esc(r[1] || 'No SKU')}</span>
      <span class="ti">${esc(r[2])}</span>
      <span class="ve">${esc(r[3])}</span>
      <a href="${SHOP_ADMIN}${r[0]}" target="_blank" rel="noopener" title="Open in Shopify">${EXT_ICON}</a>
    </div>`).join('') : '<div class="sr"><span class="ti">No products match this filter.</span></div>')
    + (rows.length > shown.length
      ? `<div class="more"><button class="btn-sm" onclick="moreBucket(this, ${n})">Show ${num(Math.min(PAGE, rows.length - shown.length))} more (${num(rows.length - shown.length)} left)</button></div>`
      : '');
}

function filterBucket(input, n) {
  const box = input.closest('.dlist');
  box._q = input.value;
  box._limit = PAGE;
  drawBucket(box, n);
}

function moreBucket(btn, n) {
  const box = btn.closest('.dlist');
  box._limit += PAGE;
  drawBucket(box, n);
}

function toCSV(rows) {
  const q = v => {
    const s = String(v ?? '');
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const head = ['SKU', 'Product', 'Vendor', 'Images', 'Shopify link'];
  const lines = rows.map(r => [r[1], r[2], r[3], r[4], SHOP_ADMIN + r[0]].map(q).join(','));
  return '\ufeff' + [head.join(','), ...lines].join('\r\n');
}

function download(name, text) {
  const url = URL.createObjectURL(new Blob([text], { type: 'text/csv;charset=utf-8' }));
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

const stamp = () => new Date().toISOString().slice(0, 10);

function exportBucket(n, btn) {
  const box = btn.closest('.dlist');
  const rows = bucketRows(box, n);
  const slug = n === 0 ? 'no-images' : `${n}-image${n === 1 ? '' : 's'}`;
  download(`products-${slug}-${stamp()}.csv`, toCSV(rows));
}

function exportAll() {
  const rows = (PROD.products || []).slice().sort((a, b) => a[4] - b[4] || String(a[1]).localeCompare(String(b[1])));
  download(`products-image-counts-${stamp()}.csv`, toCSV(rows));
}

// ================= Descriptions: review =================
let DDATA = [];
let DLOADED = false;
const dsel = {};
const dmain = document.getElementById('dreview');
const dlistEl = document.getElementById('dlist');

function sanitize(html) {
  const doc = new DOMParser().parseFromString('<div>' + (html || '') + '</div>', 'text/html');
  doc.querySelectorAll('script,style,iframe,object,embed,link,meta,form').forEach(n => n.remove());
  doc.querySelectorAll('*').forEach(el => {
    [...el.attributes].forEach(a => {
      if (/^on/i.test(a.name) || (/^(href|src)$/i.test(a.name) && /^\s*javascript:/i.test(a.value))) el.removeAttribute(a.name);
    });
  });
  return doc.body.firstChild.innerHTML.trim();
}
const host = u => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return u; } };

async function dload() {
  dmain.innerHTML = '<div class="empty">Loading descriptions…</div>';
  try {
    const res = await fetch(DPENDING_URL);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();
    DDATA = (json.products || []).map((p, i) => ({ ...p, sources: p.sources || [], n: i + 1 }));
    Object.keys(dsel).forEach(k => delete dsel[k]);
    DLOADED = true;
    drender();
  } catch (e) {
    dmain.innerHTML = `<div class="empty">Couldn't load descriptions. Check DPENDING_URL and that the n8n workflow is active.<br><br>${esc(e)}</div>`;
  }
}

function drender() {
  updateBatchLabel();
  dlistEl.innerHTML = '';
  const dbar = document.getElementById('dbar');
  if (!DDATA.length) {
    dmain.innerHTML = '<div class="empty">No descriptions waiting for review — all caught up.</div>';
    dbar.style.display = 'none';
    drefresh();
    return;
  }
  dbar.style.display = view === 'dreview' ? 'flex' : 'none';
  dmain.innerHTML = '';

  DDATA.forEach((p, i) => {
    const b = document.createElement('button');
    b.innerHTML = `<span class="num"><i>${p.n}</i></span><span class="lbl">${esc(p.title || p.k)}</span>`;
    b.dataset.pane = p.k;
    b.onclick = () => dactivate(p.k);
    dlistEl.appendChild(b);

    const d = document.createElement('div');
    d.className = 'dpane';
    d.id = 'dp-' + p.k;
    d.innerHTML = `
      <div class="t">${esc(p.title || '')}</div>
      <div class="meta2">SKU: ${esc(p.sku || 'n/a')} · Vendor: ${esc(p.vendor || 'n/a')}</div>
      ${p.sources.length ? `<div class="dsrc">Rewritten from ${p.sources.map(u => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(host(u))}</a>`).join(', ')}</div>` : ''}
      <div class="dcols">
        <div class="dcol">
          <div class="dcol-h">Current on Shopify</div>
          <div class="dbody cur">${p.current ? sanitize(p.current) : '<p class="none">No description yet</p>'}</div>
        </div>
        <div class="dcol new">
          <div class="dcol-h">New description <span>Click the text to edit</span><button class="htmlbtn" onclick="dToggleHtml('${p.k}', this)">Edit HTML</button></div>
          <div class="dbody edit" contenteditable="true" id="de-${p.k}">${sanitize(p.proposed)}</div>
          <textarea class="dhtml" id="dh-${p.k}" spellcheck="false" style="display:none"></textarea>
        </div>
      </div>
      <div class="nav2">
        ${i > 0 ? `<button class="back" onclick="dactivate('${DDATA[i - 1].k}')">Back</button>` : ''}
        ${i < DDATA.length - 1 ? `<button class="next" onclick="dactivate('${DDATA[i + 1].k}')">Next</button>` : `<button class="fin" onclick="dsubmit()">Finish</button>`}
        <button class="dno" onclick="dmark('${p.k}', 'rejected')">Decline</button>
        <button class="dyes" onclick="dmark('${p.k}', 'approved')">Approve</button>
      </div>`;
    dmain.appendChild(d);
  });

  dactivate(DDATA[0].k);
  drefresh();
}

function dactivate(id) {
  dlistEl.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.pane === id));
  dmain.querySelectorAll('.dpane').forEach(p => p.classList.toggle('active', p.id === 'dp-' + id));
  window.scrollTo(0, 0);
}

function dmark(k, decision) {
  dsel[k] = dsel[k] === decision ? undefined : decision;
  const pane = document.getElementById('dp-' + k);
  pane.classList.toggle('approved', dsel[k] === 'approved');
  pane.classList.toggle('declined', dsel[k] === 'rejected');
  drefresh();
  // Move on to the next product after a decision
  const i = DDATA.findIndex(p => p.k === k);
  if (dsel[k] && i < DDATA.length - 1) setTimeout(() => dactivate(DDATA[i + 1].k), 250);
}

function drefresh() {
  let done = 0;
  DDATA.forEach(p => {
    const btn = dlistEl.querySelector(`button[data-pane="${p.k}"]`);
    if (!btn) return;
    btn.classList.toggle('done', dsel[p.k] === 'approved');
    btn.classList.toggle('rej', dsel[p.k] === 'rejected');
    if (dsel[p.k]) done++;
  });
  document.getElementById('dptxt').textContent = done + ' / ' + DDATA.length + ' reviewed';
  document.getElementById('dpfill').style.width = (DDATA.length ? done / DDATA.length * 100 : 0) + '%';
}

function dToggleHtml(k, btn) {
  const ed = document.getElementById('de-' + k), ta = document.getElementById('dh-' + k);
  if (ta.style.display === 'none') {
    ta.value = ed.innerHTML.trim();
    ta.style.display = ''; ed.style.display = 'none';
    btn.textContent = 'Preview';
  } else {
    ed.innerHTML = sanitize(ta.value);
    ed.style.display = ''; ta.style.display = 'none';
    btn.textContent = 'Edit HTML';
  }
}

function dGetHtml(k) {
  const ed = document.getElementById('de-' + k), ta = document.getElementById('dh-' + k);
  return sanitize(ta.style.display === 'none' ? ed.innerHTML : ta.value);
}

async function dsubmit() {
  const items = DDATA.filter(p => dsel[p.k]).map(p => ({
    productId: p.k,
    decision: dsel[p.k],
    html: dsel[p.k] === 'approved' ? dGetHtml(p.k) : ''
  }));
  const note = document.getElementById('dnote');
  if (!items.length) { note.textContent = 'Nothing reviewed yet — Approve or Decline at least one product first.'; return; }
  const empty = items.find(x => x.decision === 'approved' && !x.html.replace(/<[^>]+>/g, '').trim());
  if (empty) { note.textContent = 'One approved description is empty. Add text or Decline it.'; return; }

  note.textContent = 'Updating Shopify…';
  try {
    const res = await fetch(DSUBMIT_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ items }) });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    note.textContent = 'Shopify updated. Reloading…';
    DHIST_LOADED = false;
    setTimeout(dload, 1200);
  } catch (e) {
    note.textContent = 'Failed to submit: ' + e;
  }
}

// ================= Descriptions: history =================
let DHIST = [];
let DHIST_LOADED = false;
let dhQuery = '';
const dhist = document.getElementById('dhistory');
const DBUCKETS = {
  approved: { chip: 'ok', text: c => `<b>${plural(c, 'product', 'products')}</b> got a new description` },
  rejected: { chip: 'no', text: c => `<b>${plural(c, 'product', 'products')}</b> declined` },
  not_found: { chip: 'nf', text: c => `<b>${plural(c, 'product', 'products')}</b> had no description found online` }
};
const DORDER = ['approved', 'rejected', 'not_found'];

async function dloadHistory(force) {
  if (DHIST_LOADED && !force) { drenderHistory(); return; }
  dhist.innerHTML = '<div class="empty">Loading history…</div>';
  try {
    const res = await fetch(DHISTORY_URL);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();
    DHIST = json.history || [];
    DHIST_LOADED = true;
    drenderHistory();
  } catch (e) {
    dhist.innerHTML = `<div class="empty">Couldn't load history. Check DHISTORY_URL and that the n8n workflow is active.<br><br>${esc(e)}</div>`;
  }
}

function drates(list) {
  const a = list.filter(p => p.status === 'approved').length;
  const d = list.filter(p => p.status === 'rejected').length;
  const base = a + d;
  const ap = base ? Math.round(a / base * 100) : 0;
  return { a, d, base, ap, dp: base ? 100 - ap : 0 };
}

function drenderHistory() {
  const total = DHIST.length;
  const nf = DHIST.filter(p => p.status === 'not_found').length;
  const R = drates(DHIST);

  dhist.innerHTML = `
    <div class="h-head">
      <div>
        <h1>Description history</h1>
        <div class="h-sub">What was updated on Shopify, day by day</div>
      </div>
      <button class="refresh" onclick="dloadHistory(true)">${REFRESH_ICON}Refresh</button>
    </div>
    <div class="summary s4">
      <div><div class="v">${num(total)}</div><div class="l">Products reviewed</div></div>
      <div><div class="v blue">${num(R.a)}</div><div class="l">Descriptions approved</div></div>
      <div><div class="v">${num(R.d)}</div><div class="l">Declined</div></div>
      <div><div class="v warn">${num(nf)}</div><div class="l">Nothing found online</div></div>
    </div>
    ${R.base ? `<div class="rates">
      <div class="rates-top">
        <div><div class="rv ok-t">${R.ap}%</div><div class="rl">Approve rate</div></div>
        <div><div class="rv no-t">${R.dp}%</div><div class="rl">Decline rate</div></div>
        <div class="rn">Out of ${plural(R.base, 'reviewed product', 'reviewed products')}. Products with nothing found online aren't counted.</div>
      </div>
      <div class="rbar"><span class="a" style="width:${R.ap}%"></span><span class="d" style="width:${R.dp}%"></span></div>
      <div class="rleg">
        <span><i style="background:#1565C0"></i>${plural(R.a, 'product', 'products')} approved</span>
        <span><i style="background:#d9534f"></i>${plural(R.d, 'product', 'products')} declined</span>
      </div>
    </div>` : ''}
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="dhsearch" type="search" placeholder="Search by SKU, product or vendor" value="${esc(dhQuery)}">
    </div>
    <div id="dhdays"></div>`;

  document.getElementById('dhsearch').addEventListener('input', e => { dhQuery = e.target.value; drenderDays(); });
  drenderDays();
}

function drenderDays() {
  const box = document.getElementById('dhdays');
  if (!DHIST.length) { box.innerHTML = '<div class="nores">No reviewed descriptions yet. They appear here after you confirm a review.</div>'; return; }

  const q = dhQuery.trim().toLowerCase();
  const rows = q
    ? DHIST.filter(p => [p.sku, p.title, p.vendor, p.k].some(v => String(v || '').toLowerCase().includes(q)))
    : DHIST;
  if (!rows.length) { box.innerHTML = '<div class="nores">No products match this search.</div>'; return; }

  const days = {};
  rows.forEach(p => {
    const dk = dayKey(p.at);
    days[dk] = days[dk] || {};
    (days[dk][p.status] = days[dk][p.status] || []).push(p);
  });
  const dayKeys = Object.keys(days).sort((a, b) => a === 'unknown' ? 1 : b === 'unknown' ? -1 : b.localeCompare(a));

  box.innerHTML = '<div class="days">' + dayKeys.map(dk => {
    const buckets = days[dk];
    const all = Object.values(buckets).flat();
    const r = drates(all);
    return `<section class="day">
      <div class="day-h">
        <div>
          <div class="day-d">${dayLabel(dk)}</div>
          <div class="day-t">${plural(all.length, 'product', 'products')} reviewed, ${plural(r.a, 'description', 'descriptions')} updated</div>
        </div>
        ${r.base ? `<div class="day-r">
          <div class="mbar"><span class="a" style="width:${r.ap}%"></span><span class="d" style="width:${r.dp}%"></span></div>
          <span><b class="ok-t">${r.ap}%</b> approved</span>
          <span><b class="no-t">${r.dp}%</b> declined</span>
        </div>` : '<div class="day-r">Only products with nothing found</div>'}
      </div>
      ${DORDER.filter(s => buckets[s]).map(s => {
        const prods = buckets[s].slice().sort((x, y) => new Date(y.at || 0) - new Date(x.at || 0));
        return `
        <div class="bk" tabindex="0" role="button" aria-expanded="${q ? 'true' : 'false'}" ${q ? 'data-open' : ''} onclick="toggleOpen(this)" onkeydown="keyToggle(event,this)">
          <span class="chip ${DBUCKETS[s].chip}">${prods.length}</span>
          <span class="bk-txt">${DBUCKETS[s].text(prods.length)}</span>
          ${CHEV}
        </div>
        <div class="bk-list">${prods.map(p => `
          <div class="pr" tabindex="0" role="button" aria-expanded="false" onclick="toggleOpen(this)" onkeydown="keyToggle(event,this)">
            <span class="pr-sku">${esc(p.sku || 'No SKU')}</span>
            <span class="pr-title">${esc(p.title || p.k)}</span>
            <span class="pr-time">${fmtTime(p.at)}</span>
            ${CHEV}
          </div>
          <div class="pr-img">${ddetail(p)}</div>`).join('')}
        </div>`;
      }).join('')}
    </section>`;
  }).join('') + '</div>';

  if (q) box.querySelectorAll('.bk[data-open]').forEach(el => { el.classList.add('open'); el.nextElementSibling.classList.add('open'); });
}

function ddetail(p) {
  if (p.status === 'not_found') {
    return `<div class="nfnote">${NF_ICON}
      <div><b>No description found online</b>Nothing usable came up for this product. Write it manually or ask the supplier for specs.</div>
    </div>`;
  }
  if (p.status === 'approved') {
    return `<div class="dlabel">Description now on Shopify</div><div class="ddesc">${sanitize(p.final || p.proposed) || '<p>Empty</p>'}</div>`;
  }
  return `<div class="dlabel">Declined <span>(the proposed description)</span></div><div class="ddesc dim">${sanitize(p.proposed) || '<p>Empty</p>'}</div>`;
}

load();
</script>
</body>
</html>
